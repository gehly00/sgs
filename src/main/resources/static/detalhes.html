<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SGS - Detalhes da Solicitação</title>
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header class="cabecalho">
            <div class="cabecalho-conteudo">
                <div class="marca">
                    <div class="marca-icone"> ✓ </div>
                    <div>
                        <h1>SGS</h1>
                        <span>Sistema de Gestão de Solicitações</span>
                    </div>
                </div>
                <div class="cabecalho-acoes">
                    <a href="index.html" class="botao-secundario">Voltar</a>
                </div>
            </div>
        </header>

        <main class="container">
            <section class="pagina-introducao">
                <div>
                    <span class="etiqueta">DETALHES</span>
                    <h2 id="titulo-solicitacao">Solicitação</h2>
                </div>
            </section>
            <section class="card card-detalhes">
                <div class="detalhes-grid">
                    <div class="detalhe-item">
                        <span class="detalhe-label">Solicitante</span>
                        <strong id="solicitante"></strong>
                    </div>
                    <div class="detalhe-item">
                        <span class="detalhe-label">CPF/CNPJ</span>
                        <strong id="cpfCnpj"></strong>
                    </div>
                    <div class="detalhe-item">
                        <span class="detalhe-label">Categoria</span>
                        <strong id="categoria"></strong>
                    </div>
                    <div class="detalhe-item">
                        <span class="detalhe-label">Valor</span>
                        <strong id="valor"></strong>
                    </div>
                    <div class="detalhe-item">
                        <span class="detalhe-label">Data da solicitação</span>
                        <strong id="dataSolicitacao"></strong>
                    </div>
                    <div class="detalhe-item">
                        <span class="detalhe-label">Status atual</span>
                        <strong id="statusAtual" class="status"></strong>
                    </div>
                    <div class="detalhe-item detalhe-completo">
                        <span class="detalhe-label">Descrição</span>
                        <p id="descricao"></p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="rodape">
            <div class="rodape-conteudo">
                <div>
                    <strong>SGS</strong>
                    <span>Sistema de Gestão de Solicitações</span>
                </div>
                <span class="rodape-versao">Desafio Técnico</span>
            </div>
        </footer>

        <script src="js/detalhes.js"></script>

    </body>

</html>
